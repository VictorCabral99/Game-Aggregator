name: CI

on:
  push:
    branches: ["main", "feat/**", "docs/**"]
  pull_request:

jobs:
  typecheck-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -w @gagg/core
      - run: npm run build -w @gagg/desktop
